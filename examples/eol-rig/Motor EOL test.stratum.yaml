# Stratum workflow · Motor EOL test
# Inputs bind by CSV column name. Steps refer to channels and earlier steps
# by id; step[2] is the second output of a step. Open it in Stratum with
# Import → Open a workflow file…, or edit it in any text editor.
format: stratum-workflow
version: 2
name: Motor EOL test
revision: '1'
description: >-
  End-of-line test for the motor rig. Three speed sweeps are found with speed
  triggers, then torque within each sweep, temperature and current are
  checked against limits.
item:
  label: Serial number
  id: { from: file-name, pattern: '^(?<id>SN-[0-9]+)' }
input:
  channels:
    speed: { name: Motor speed, unit: rpm }
    torque: { name: Torque, unit: Nm }
    current: { name: Supply current, unit: A }
    temperature: { name: Winding temperature, unit: °C }
steps:
  - id: smoothed-torque
    name: Smooth measured torque
    derive: { function: smooth, input: torque, parameter: 5 }
    outputs: Smoothed torque
    checks:
      - missing: { max: 0.01 }
        severity: warning
        message: Torque has dropouts.

  - id: power
    name: Multiply torque and speed
    derive: { function: multiply, input: smoothed-torque, with: speed }
    outputs: Torque × speed

  # Triggers on speed find the sweeps wherever they occur in the recording.
  # Segments are time intervals; later steps work within them.
  - id: sweeps
    name: Find the speed sweeps
    segment:
      triggers:
        start: { signal: speed, edge: rising, threshold: 850 }
        end: { signal: speed, edge: falling, threshold: 850 }
        minimum-duration: 20
      boundary: discard
    outputs: Sweep {n}
    checks:
      - count: 3
        severity: fail
        message: The rig should record three speed sweeps.
      - duration: { min: 35, max: 45 }
        severity: warning
        message: Sweeps should last about 40 s.
    on-fail: stop

  - id: sweep-torque
    name: Average torque by sweep
    value: { function: time-average, input: smoothed-torque, within: sweeps }
    outputs: '{segment} · Average torque'
    checks:
      - limits: { min: 78, max: 95, unit: Nm }
        severity: fail

  # Windows within a segment are seconds from that segment's start.
  - id: sweep-2-halves
    name: Split sweep 2 into halves
    segment:
      within: sweeps[2]
      windows: { start: 0, end: 40, duration: 20, step: 20, partial: false }
      boundary: clip
    outputs: [Sweep 2 · First half, Sweep 2 · Second half]

  - id: half-peaks
    name: Peak torque within sweep 2
    value:
      function: maximum
      input: smoothed-torque
      within: sweep-2-halves
    outputs: '{segment} · Peak torque'

  - id: peak-temperature
    name: Peak winding temperature
    value: { function: maximum, input: temperature }
    outputs: Peak winding temperature
    checks:
      - limits: { max: 90, unit: °C }
        severity: warning
        message: The winding ran hot.

  - id: average-current
    name: Average supply current
    value: { function: time-average, input: current }
    outputs: Average supply current
    checks:
      - limits: { max: 20, unit: A }
        severity: fail

report:
  title: Motor EOL report · {{item.id}}
  page-size: a4
  orientation: portrait
  pages:
    - blocks:
        - type: text
          name: Eyebrow
          y: 40
          width: 698
          height: 24
          text: STRATUM · END-OF-LINE TEST
          font-size: 11
          bold: true
          color: '#167f8c'
          padding: 0
        - type: text
          name: Title
          y: 70
          width: 698
          height: 80
          text: |-
            Motor EOL report
            {{item.label}} {{item.id}}
          font-size: 28
          bold: true
          color: '#173447'
          padding: 0
        - type: text
          name: Summary
          y: 160
          width: 698
          height: 100
          text: |-
            Result: {{run.status}} · {{run.flags}}
            Recording: {{file.name}} · processed {{run.date}}
            Workflow: {{workflow.name}} revision {{workflow.revision}} · {{workflow.hash}}
          font-size: 12
          color: '#33495a'
        - type: plot
          name: Torque plot
          y: 270
          width: 698
          height: 300
          text: Smoothed torque
          bind: { signal: smoothed-torque }
        - type: table
          name: Key results
          y: 590
          width: 698
          height: 230
          text: Key results
          bind:
            values: [sweep-torque, half-peaks, peak-temperature, average-current]
        - type: table
          name: Checks
          y: 840
          width: 698
          height: 240
          text: Checks
          bind: { checks: all }
